name: Step Data Practice

on:
  workflow_dispatch:

env:
  APP_VERSION: "1.0.0"

jobs:
  welcome-job:
    name: welcome-job
    runs-on: ubuntu-latest

    steps:
      - name: Генерация данных
        run: |
          random_value=$RANDOM
          echo "RANDOM_NUM=$random_value" >> "$GITHUB_ENV"

      - name: Использование данных
        run: echo "Сгенерированное число: $RANDOM_NUM"

      - name: Финал
        run: 'echo "Сборка версии $APP_VERSION успешно завершена пользователем ${{ github.actor }}"'
